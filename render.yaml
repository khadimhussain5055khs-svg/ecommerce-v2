services:
  - type: web
    name: ecommerce-backend
    env: node
    plan: free
    branch: main
    buildCommand: cd backend && npm install && npm run prisma:generate
    startCommand: cd backend && npm start
    autoDeploy: true
    healthCheckPath: /api/v1
    envVars:
      - key: DATABASE_URL
      - key: JWT_SECRET
      - key: JWT_EXPIRES_IN
      - key: FRONTEND_URL
      - key: OWNER_EMAIL
      - key: OWNER_PASSWORD
      - key: OWNER_NAME
      - key: RAZORPAY_KEY_ID
      - key: RAZORPAY_KEY_SECRET
